name: Construire et publier Pas communs

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.12', '3.13', '3.14']
        include:
          - os: windows-2025
            python: '3.12'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Construire et tester le wheel installé
        run: |
          python -m pip install -r requirements-construction.txt
          python scripts/construire-wheel.py
          python -m pip install --no-deps dist/*.whl
          python -m pip install -r requirements-tests-auth.txt
          python -m unittest discover -s tests
          python tests/verifier_authentification_django.py
          python -m pip check
      - uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        with:
          name: wheel-valide
          path: dist/
          if-no-files-found: error
          retention-days: 30

  navigateur:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/test_navigateur.mjs

  publier:
    if: github.ref_type == 'tag'
    needs: [verifier, navigateur]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: wheel-valide
          path: dist
      - name: Publier les octets validés sans reconstruction
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PYVERSION'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['TAG'] != version:
              raise SystemExit('Le tag doit correspondre à la version du paquet.')
          if not Path('dist', f'pas_communs-{version}-py3-none-any.whl').is_file():
              raise SystemExit('Wheel de la version absent.')
          PYVERSION
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$TAG" dist/*.whl dist/SHA256SUMS --verify-tag --draft             --title "Pas communs $TAG" --notes 'Moteur de paquets SQLite et médias. Voir README.md et PAQUETS.md au tag.'
          gh release download "$TAG" --dir verification
          (cd verification && sha256sum --check SHA256SUMS)
          gh release edit "$TAG" --draft=false
