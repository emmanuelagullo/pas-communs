name: Qualifier les octets publiés

# Après la publication d'un tag, reconstruit l'application minimale à partir du wheel
# téléchargé depuis la release (jamais depuis src/) et qualifie le programme obtenu.
# Elle ne prouve pas le transfert vers GitLab Inria : seulement les octets de la release.

on:
  workflow_run:
    workflows: ['Construire et publier Pas communs']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag déjà publié (ex. 0.10.0)
        required: true

permissions:
  contents: read

jobs:
  cible:
    # Un push sur main ne publie rien : seules les exécutions de tag sont qualifiées.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch != 'main')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag invalide : $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  programme:
    name: ${{ matrix.nom }}
    needs: cible
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nom: Linux x86_64, os: ubuntu-24.04, experimental: false, pdf: 'true',
             options: '--avec-fenetre --avec-pdf'}
          - {nom: Windows x64, os: windows-2025, experimental: false, pdf: 'false',
             options: '--avec-installateur'}
          - {nom: macOS arm64, os: macos-15, experimental: true, pdf: 'true',
             options: '--avec-fenetre --avec-pdf'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.cible.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/bureau-minimal
        with:
          pdf: ${{ matrix.pdf }}
      - name: Télécharger et vérifier le wheel publié
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.cible.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir publie
          python - <<'PYVERIF'
          import hashlib, os
          from pathlib import Path
          dossier = Path('publie')
          attendu = {}
          for ligne in (dossier / 'SHA256SUMS').read_text(encoding='utf-8').splitlines():
              if ligne.strip():
                  empreinte, nom = ligne.split(maxsplit=1)
                  attendu[nom.strip().lstrip('*')] = empreinte
          wheels = sorted(dossier.glob('*.whl'))
          if len(wheels) != 1 or wheels[0].name not in attendu:
              raise SystemExit('Un seul wheel déclaré dans SHA256SUMS est attendu.')
          if hashlib.sha256(wheels[0].read_bytes()).hexdigest() != attendu[wheels[0].name]:
              raise SystemExit('Empreinte du wheel publié incorrecte.')
          if wheels[0].name != f"pas_communs-{os.environ['TAG']}-py3-none-any.whl":
              raise SystemExit('Le wheel ne correspond pas au tag.')
          print(wheels[0].name, attendu[wheels[0].name])
          PYVERIF
      - name: Installer le wheel publié
        run: python -m pip install --no-deps publie/*.whl
      - name: Qualifier l'application minimale
        env:
          TAG: ${{ needs.cible.outputs.tag }}
        run: python tests/application_minimale/qualifier.py --version-attendue "$TAG" ${{ matrix.options }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: programme-publie-${{ runner.os }}
          path: tests/application_minimale/dist/PasCommunsMinimale-*
          if-no-files-found: ignore
          retention-days: 7
