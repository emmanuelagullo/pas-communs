name: Programmes de bureau minimaux

# Construit et qualifie l'application minimale (tests/application_minimale) à partir du
# wheel du commit, sur chaque système livré. Elle ne publie rien et n'est pas un produit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  programme:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    # macOS reste non bloquant tant que ses étapes n'ont pas été vues vertes en CI.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nom: Linux x86_64, os: ubuntu-24.04, experimental: false, pdf: 'true',
             options: '--avec-fenetre --avec-pdf'}
          - {nom: Windows x64, os: windows-2025, experimental: false, pdf: 'false',
             options: '--avec-installateur'}
          - {nom: macOS arm64, os: macos-15, experimental: true, pdf: 'true',
             options: '--avec-fenetre --avec-pdf'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/bureau-minimal
        with:
          pdf: ${{ matrix.pdf }}
      - name: Construire et installer le wheel du commit
        run: |
          python -m pip install -r requirements-construction.txt
          python scripts/construire-wheel.py
          python -m pip install --no-deps dist/*.whl
      - name: Qualifier l'application minimale
        run: python tests/application_minimale/qualifier.py ${{ matrix.options }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: programme-minimal-${{ runner.os }}
          path: tests/application_minimale/dist/PasCommunsMinimale-*
          if-no-files-found: ignore
          retention-days: 7
