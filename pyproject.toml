[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pas-communs"
version = "0.7.0"
description = "Moteur de paquets SQLite et médias pour les applications de la famille Pas"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = []

[project.urls]
Source = "https://gitlab.inria.fr/pas-communs/pas-communs"
Mirror = "https://github.com/emmanuelagullo/pas-communs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pas_communs.navigateur" = ["*.mjs"]

"pas_communs" = ["polices/*.ttf", "polices/*.txt", "installateur/*.iss", "installateur/*.ps1"]
