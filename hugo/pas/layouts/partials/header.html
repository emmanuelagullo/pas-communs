<header class="site-header">
  <div class="shell nav">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Accueil {{ site.Title }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ site.Title }}</a>
    <nav aria-label="Navigation principale">
      {{ range site.Menus.main }}
      <a href="{{ .URL | relURL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
