image: python:3.12-slim

# Même sélection de runners que Petits Pas pour les contrôles ordinaires.
default:
  tags:
    - ci.inria.fr
    - small

stages: [test]

test:
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13", "3.14"]
  image: python:${PYTHON_VERSION}-slim
  script:
    - python -m pip install -r requirements-construction.txt
    - python scripts/construire-wheel.py
    - python -m pip install --no-deps dist/*.whl
    - python -m pip install -r requirements-tests-auth.txt -r requirements-tests-pdf.txt
    - python -m unittest discover -s tests
    - python tests/verifier_authentification_django.py
    - python -m pip check
  artifacts:
    paths: [dist/]
    expire_in: 30 days

contrat-navigateur:
  image: node:24-slim
  script:
    - node --test tests/test_navigateur.mjs
